[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sifututor-agent-os-omnigent"
version = "0.1.0"
description = "Sifututor Agent OS policy adapter for Omnigent"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "omnigent>=0.7.0,<0.9"]

[project.scripts]
agent-os-link-continuity = "sifututor_agent_os_omnigent.linking:main"
agent-os-set-proven-state = "sifututor_agent_os_omnigent.state:main"
agent-os-set-understanding = "sifututor_agent_os_omnigent.understanding:main"

[tool.setuptools]
packages = ["sifututor_agent_os_omnigent"]
package-dir = { sifututor_agent_os_omnigent = "." }
